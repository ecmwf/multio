# Full grib-to-mtg2 configuration reference.
# Values below form a usable baseline; comments document alternatives.

reader:
  # Valid values: eccodes-stream, candidate-boundary.
  mode: candidate-boundary

stages:
  grib-based-filter:
    # Effective range: 0-3.
    verbosity: 0
    enable-debug-sink: true

    # Valid values: try-to-handle, ignore.
    # The aliases skip and log-and-ignore are equivalent to ignore.
    grib1-messages-policy: try-to-handle
    grib2-messages-policy: try-to-handle
    invalid-messages-policy: try-to-handle

    # This option can instead be the scalar value ignore or try-to-handle.
    # In section form, discipline 192 is ignored except for the listed types.
    # Valid try-to-handle entries: me, 4i.
    discipline192-messages-policy:
      try-to-handle: [me, 4i]
