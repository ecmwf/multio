# Minimal example for the scalar grib2grib options parser tool.
verbosity: 0

grib1-messages-policy: try-to-handle
grib2-messages-policy: ignore
invalid-messages-policy: try-to-handle
discipline192-messages-policy: ignore

packing: ccsds
# model: ifs
ncycle: 162
control: false
expver: "0001"

mars2grib-options:
  applyChecks: true



sink:
  type: fdb5
  config:
    # Optional FDB5 userConfig. If omitted, the sink defaults to `useSubToc: true`.
    fdb_home: '/home/fdbsc'
    userConfig:
      useSubToc: true

mars2grib-generate-testcases: true
mars2grib-testcases-dir: /home/mavm/ba/multio-bundle/source/multio/share/multio/grib1-to-grib2/testcases